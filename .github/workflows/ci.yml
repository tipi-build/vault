name: build 
# This workflow is triggered on pushes to the repository.
on: [push]

jobs:
  build-wasm-asmjs:
    name: build-wasm-asmjs
    runs-on: ubuntu-latest
    container: tipibuild/tipi-ubuntu:v0.0.72
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: tipi builds project
        run: |
          tipi . --dont-upgrade --verbose -t wasm-asmjs-cxx17  -G "Unix Makefiles" --test all

  build-linux:
    name: build-linux
    runs-on: ubuntu-latest
    container: tipibuild/tipi-ubuntu:latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: tipi builds project
        run: |
          tipi . --dont-upgrade --verbose -t linux-cxx17 --test all
